<div class="row">
  <div class="col-md-8 offset-md-2">
    <div class="table-responsive">
      <table class="table table-striped table-bordered table-hover">
        <thead>
          <tr>
            <th><app-sort-header [orderOptions]="orderAndPage" [orderField]="'UserName'" text="User Name" (orderChanged)="updateView($event)"></app-sort-header></th>
            <th class="icon-col-1">&nbsp;</th>
          </tr>
        </thead>
        <tbody>
          @for (user of users(); track user.userName) {
            <tr>
              <td>
                {{ user.userName }}
              </td>
              <td class="text-end">
                <button type="button" class="btn btn-danger btn-sm" (click)="deleteUser(user.userName)">
                  <i class="fa fa-trash-o"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div><app-pagination [pageOptions]="orderAndPage" [totalCount]="totalCount()" (pageChanged)="updateView($event)"></app-pagination></div>
  </div>
</div>
