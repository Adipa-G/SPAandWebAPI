<div class="row">
  <div class="col-md-4 offset-md-2">
    <div class="mb-3">
      <label for="logLevel" class="form-label">Level</label>
      <select class="form-control" id="logLevel"
        [(ngModel)]="filter.logLevel"
        (ngModelChange)="updateView(filter)">
        <option [value]=""></option>
        @for (level of logLevels(); track level) {
          <option [value]="level">{{level}}</option>
        }
      </select>
    </div>
  </div>
  <div class="col-md-4">
    <div class="mb-3">
      <label for="trackId" class="form-label">Track Id</label>
      <input type="text" class="form-control"
        id="trackId"
        [(ngModel)]="filter.trackingId"
        (ngModelChange)="updateView(filter)"/>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 offset-md-2">
      <label for="fromDateLocal">Date From</label>
      <div class="mb-3">
        <input type="date"
          id="fromDateLocal"
          [(ngModel)]="filter.fromDateLocal"
          class="form-control"
          (ngModelChange)="updateView(filter)" />
        </div>

      </div>
      <div class="col-md-4">
        <label for="toDateLocal">Date To</label>
        <div class="mb-3">
          <input type="date"
            id="toDateLocal"
            [(ngModel)]="filter.toDateLocal"
            class="form-control"
            (ngModelChange)="updateView(filter)" />
          </div>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col-md-10 offset-md-1">
          <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
              <thead>
                <tr>
                  <th><app-sort-header [orderOptions]="filter" [orderField]="'CalledOn'" text="Time" (orderChanged)="updateView($event)"></app-sort-header></th>
                  <th><app-sort-header [orderOptions]="filter" [orderField]="'TrackingId'" text="Tracking Id" (orderChanged)="updateView($event)"></app-sort-header></th>
                  <th><app-sort-header [orderOptions]="filter" [orderField]="'RequestIdentity'" text="Caller" (orderChanged)="updateView($event)"></app-sort-header></th>
                  <th><app-sort-header [orderOptions]="filter" [orderField]="'StatusCode'" text="Status" (orderChanged)="updateView($event)"></app-sort-header></th>
                  <th><app-sort-header [orderOptions]="filter" [orderField]="'CallDuration'" text="Duration(s)" (orderChanged)="updateView($event)"></app-sort-header></th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody>
                @for (log of httpLogs(); track log.id) {
                  <tr>
                    <td><app-utc-to-local [utcTimeStr]="log.logTimestamp"></app-utc-to-local></td>
                    <td>{{ log.trackingId }}</td>
                    <td>{{ log.caller }}</td>
                    <td>{{ log.status }}</td>
                    <td>{{ log.duration }}</td>
                    <td>
                      <dl class="row">
                        <dt class="col-sm-1">Verb</dt>
                        <dd class="col-sm-11">{{ log.verb }}</dd>
                        <dt class="col-sm-1">Url</dt>
                        <dd class="col-sm-11">{{ log.requestUri }}</dd>
                        <dt class="col-sm-1">Request</dt>
                        <dd class="col-sm-11"><app-pretty-print [sourceStr]="log.request"></app-pretty-print></dd>
                        <dt class="col-sm-1">Response</dt>
                        <dd class="col-sm-11"><app-pretty-print [sourceStr]="log.response"></app-pretty-print></dd>
                        <dt class="col-sm-1" [hidden]="log.showHeaders">Headers</dt>
                        <dd class="col-sm-11" [hidden]="log.showHeaders">
                          <button type="button" class="btn btn-sm btn-success" (click)="toggleHeaders(log)">Show</button>
                        </dd>
                        <dt class="col-sm-1" [hidden]="!log.showHeaders">Request Headers</dt>
                        <dd class="col-sm-11" [hidden]="!log.showHeaders"><app-pretty-print [sourceStr]="log.requestHeaders"></app-pretty-print></dd>
                        <dt class="col-sm-1" [hidden]="!log.showHeaders">Response Headers</dt>
                        <dd class="col-sm-11" [hidden]="!log.showHeaders"><app-pretty-print [sourceStr]="log.responseHeaders"></app-pretty-print></dd>
                      </dl>
                    </td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
          <div><app-pagination [pageOptions]="filter" [totalCount]="totalCount()" (pageChanged)="updateView($event)"></app-pagination></div></div>
        </div>
