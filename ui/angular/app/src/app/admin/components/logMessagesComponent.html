<div class="row">
  <div class="col-md-4 offset-md-2">
    <div class="mb-3">
      <label for="logLevel" class="form-label">Level</label>
      <select class="form-control" id="logLevel" name="logLevel"
        [(ngModel)]="filter.logLevel"
        (ngModelChange)="updateView(filter)">
        <option [value]=""></option>
        @for (level of logLevels(); track level) {
          <option [value]="level">{{level}}</option>
        }
      </select>
    </div>
  </div>
  <div class="col-md-4">
    <div class="mb-3">
      <label for="logger" class="form-label">Logger</label>
      <select class="form-control" id="logger" name="logger"
        [(ngModel)]="filter.logger"
        (ngModelChange)="updateView(filter)">
        <option [value]=""></option>
        @for (logger of loggers(); track logger) {
          <option [value]="logger">{{logger}}</option>
        }
      </select>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-4 offset-md-2">
    <label for="fromDateLocal" class="form-label">Date From</label>
    <div class="mb-3">
      <input type="date" id="fromDateLocal" name="fromDateLocal"
        [(ngModel)]="filter.fromDateLocal"
        class="form-control"
        (ngModelChange)="updateView(filter)"/>
    </div>
  </div>
  <div class="col-md-4">
    <label for="toDateLocal" class="form-label">Date To</label>
    <div class="mb-3">
      <input type="date" id="toDateLocal" name="toDateLocal"
        [(ngModel)]="filter.toDateLocal"
        class="form-control"
        (ngModelChange)="updateView(filter)"/>
    </div>
  </div>
</div>

<div class="row mt-5">
  <div class="col-md-10 offset-md-1">
    <div class="table-responsive">
      <table class="table table-striped table-bordered table-hover">
        <thead>
          <tr>
            <th><app-sort-header [orderOptions]="filter" [orderField]="'LogTimestamp'" text="Time" (orderChanged)="updateView($event)"></app-sort-header></th>
            <th><app-sort-header [orderOptions]="filter" [orderField]="'Logger'" text="Logger" (orderChanged)="updateView($event)"></app-sort-header></th>
            <th><app-sort-header [orderOptions]="filter" [orderField]="'Level'" text="Level" (orderChanged)="updateView($event)"></app-sort-header></th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody>
          @for (log of logMessages(); track log.id) {
            <tr>
              <td><app-utc-to-local [utcTimeStr]="log.logTimestamp"></app-utc-to-local></td>
              <td>{{ log.logger }}</td>
              <td>{{ log.level }}</td>
              <td>
                <dl class="row">
                  <dt class="col-sm-1">Message</dt>
                  <dd class="col-sm-11">{{ log.message }}</dd>
                  <dt class="col-sm-1" [hidden]="!log.stackTrace">Stack Trace</dt>
                  <dd class="col-sm-11" [hidden]="!log.stackTrace">{{ log.stackTrace }}</dd>
                </dl>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div><app-pagination [pageOptions]="filter" [totalCount]="totalCount()" (pageChanged)="updateView($event)"></app-pagination></div>
  </div>
</div>
